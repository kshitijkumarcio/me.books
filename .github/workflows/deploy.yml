name: Vercel Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Deploy-Production:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: The Ghost Writer Bypass (Forge Git Identity)
        run: |
          git config --global user.name "kshitijkumarpantawane"
          git config --global user.email "kshitijkumarpantawane@gmail.com"
          git commit --amend --author="kshitijkumarpantawane <kshitijkumarpantawane@gmail.com>" --no-edit || true

      - name: Clean Local Vercel Cache
        run: rm -rf .vercel

      - name: Pull Vercel Environment Information
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # - name: Deploy Convex Backend Functions
      #   env:
      #     CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      #   run: |
      #     if [ -n "$CONVEX_DEPLOY_KEY" ]; then
      #       bunx convex deploy
      #     else
      #       echo "CONVEX_DEPLOY_KEY not configured, skipping Convex deploy."
      #     fi

      - name: Build Project Artifacts
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
